# =============================================================================
# STUDY 2 -- PRE-REGISTRATION AND SINGLE SOURCE OF TRUTH
# =============================================================================
# Every data download, experiment, table, figure, and number in the paper for
# Study 2 is produced from this file by `python -m mbca study ...`.
# It was committed to git BEFORE any Study 2 data was downloaded or any Study 2
# result existed (see `git log -- study.toml`), so universe, strategies,
# components, windows, costs and tests cannot have been chosen after seeing results.
# Any later edit is visible in git history and must be recorded in
# docs/EXPERIMENT_LOG.md with its reason.
# =============================================================================

[study]
name = "MBCA Study 2: five historical strategies across a broad market universe"
data_start = "2000-01-01"
bars_per_year = 252
risk_free_rate = 0.0          # multi-currency universe: Sharpe on raw (not excess) returns
seed = 0

# Two independent freezes -> two non-overlapping out-of-sample test windows,
# each with its own frozen ML models (the "second freeze date" replication the
# original paper named as its most important missing test).
[[study.freezes]]
name = "F2008"
split = "2008-01-01"          # ML trained on 2000-2007
test_end = "2018-01-01"       # tested 2008-2017 (GFC, euro crisis, 2015-16 selloff)

[[study.freezes]]
name = "F2018"
split = "2018-01-01"          # ML trained on 2000-2017
test_end = "2100-01-01"       # tested 2018-latest (COVID crash, 2022 bear)

# -----------------------------------------------------------------------------
# UNIVERSE. Yahoo Finance symbols grouped into asset-class "markets"; each
# market's ML models are fit on that market's pooled pre-freeze data.
# Survivorship: indices, ETFs, futures, FX and crypto series are free of
# constituent survivorship; single stocks are CURRENT large caps and therefore
# survivorship-biased by construction -- analysed separately (bias test B3).
# -----------------------------------------------------------------------------
[universe.equity_indices]

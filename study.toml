# -----------------------------------------------------------------------------
# DATA CLEANING RULES (applied identically to every series; see mbca/datasets.py)
# -----------------------------------------------------------------------------
[cleaning]
use_adjusted = true           # scale O/H/L/C by adjclose/close (splits + dividends)
drop_nonpositive = true       # rows with any price <= 0 or missing close are dropped
repair_ohlc = true            # enforce low <= min(open,close) <= max(open,close) <= high
max_abs_daily_return = 0.75   # |return| above this is flagged as a bad tick and the row dropped
min_rows = 1000               # series shorter than ~4 years are excluded from Study 2

# -----------------------------------------------------------------------------
# FIVE HISTORICALLY DOCUMENTED STRATEGIES (canonical parameters + a small grid
# that the walk-forward harness selects from on each in-sample fold)
# -----------------------------------------------------------------------------
[strategies.jma_trend]
label = "JMA crossover (paper baseline)"
reference = "Study 1 baseline; Jurik moving average crossover"
signal = "jma_cross"
signal_grid = { fast = [5, 7, 9], slow = [21, 28] }
exit = "trailing"
stop_grid = { sl_mult = [1.5, 2.0], trail_mult = [2.0, 3.0] }
min_trades = 10

[strategies.sma_cross]
label = "Dual moving-average crossover"
reference = "Brock, Lakonishok & LeBaron (1992)"
signal = "sma_cross"
signal_grid = { fast = [20, 50], slow = [100, 200] }
exit = "trailing"
stop_grid = { sl_mult = [2.0, 3.0], trail_mult = [3.0, 4.0] }
min_trades = 4

[strategies.donchian]
label = "Donchian channel breakout"
reference = "Turtle trading rules (Dennis/Eckhardt); Donchian (1960)"
signal = "donchian"
signal_grid = { lookback = [20, 55] }
exit = "trailing"
stop_grid = { sl_mult = [2.0], trail_mult = [2.0, 3.0] }
min_trades = 6

[strategies.ts_momentum]
label = "Time-series momentum"
reference = "Moskowitz, Ooi & Pedersen (2012)"
signal = "ts_momentum"
signal_grid = { lookback = [126, 252] }
exit = "trailing"
stop_grid = { sl_mult = [2.0, 3.0], trail_mult = [3.0, 4.0] }
min_trades = 4

[strategies.rsi2_reversion]
label = "RSI(2) short-term mean reversion"
reference = "Connors & Alvarez (2008)"
signal = "rsi2"
signal_grid = { entry = [5, 10] }
exit = "bracket"
stop_grid = { sl_mult = [2.0, 3.0], tp_mult = [1.0, 1.5] }
min_trades = 10

# -----------------------------------------------------------------------------
# MBCA COMPONENTS (matched budget: same 8 features, same LightGBM for all)
# Regime filter uses the "linearity" label only -- fixed here, not selected.
# -----------------------------------------------------------------------------
[components]
main = ["rule_adx", "regime_linearity", "meta_label", "position_sizing", "entry", "exit", "best_combined"]
# cross-market generalization: models fit on every OTHER market, applied to this one
transfer = ["meta_label", "best_combined"]
# ablations of the ML budget itself
ablations = ["meta_label_thr045", "meta_label_thr055", "meta_label_small_model", "exit_small_model"]

# -----------------------------------------------------------------------------
# EXECUTION MODEL
# -----------------------------------------------------------------------------
[execution]
fill = "close"                # stop breached on a close -> filled AT THAT CLOSE (not at the stop level)
lag = 0                       # 0 = enter at the signal bar's close
n_splits = 5                  # walk-forward folds per instrument
portfolio = "equal_weight"    # capital split 1/N across instruments with data that day; MTM daily

# Execution-assumption sensitivity (re-runs; bias test B6)
[[execution.sensitivity]]
name = "optimistic_stop_fill"
fill = "stop"
lag = 0
variants = ["baseline", "exit", "best_combined"]

[[execution.sensitivity]]
name = "one_day_lag"
fill = "close"
lag = 1
variants = ["baseline", "exit", "best_combined"]

# -----------------------------------------------------------------------------
# STATISTICS
# -----------------------------------------------------------------------------
[statistics]
bootstrap = "paired_circular_block"   # same days resampled for variant and baseline
block_days = 20
n_boot = 2000
alpha = 0.05
fdr = "benjamini_hochberg"            # across every (strategy, market, freeze, variant) test
cost_multipliers = [0.0, 1.0, 2.0, 4.0]

# Regimes (computed from information available at t-1 only)
[regimes]
trend_sma_days = 200                  # market EW index above/below its 200-day SMA
vol_window_days = 20                  # realized vol above/below its expanding median
crises = [
  { name = "GFC", start = "2008-09-01", end = "2009-03-31" },
  { name = "Euro debt crisis", start = "2011-07-01", end = "2011-12-31" },
  { name = "2015-16 selloff", start = "2015-08-01", end = "2016-02-29" },
  { name = "COVID crash", start = "2020-02-19", end = "2020-04-30" },
  { name = "2022 bear market", start = "2022-01-01", end = "2022-10-31" },
]

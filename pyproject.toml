[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbca"
version = "1.0.0"
description = "Matched-Budget Component Attribution: where does ML add value in a hybrid rule+ML trading system?"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["mbca"]

[tool.pytest.ini_options]
testpaths = ["tests"]
